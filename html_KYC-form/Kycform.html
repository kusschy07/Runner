    <h1>KYC-form</h1>

    <!DOCTYPE html>
<html>
<head>
    <title>KYC Form</title>
</head>
<body>

    <h2>KYC Registration Form</h2>

    <form action="#" method="post" enctype="multipart/form-data">

        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="gender">Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="40"></textarea><br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="idtype">ID Proof Type:</label><br>
        <select id="idtype" name="idtype">
            <option value="">Select</option>
            <option>citizenship card</option>
            <option>NID</option>
            <option>Passport</option>
            <option>Driving License</option>
        </select><br><br>

        <label for="idnumber">ID Proof Number:</label><br>
        <input type="text" id="idnumber" name="idnumber"><br><br>

        <label for="idproof">Upload ID Proof:</label><br>
        <input type="file" id="idproof" name="idproof"><br><br>

        <input type="checkbox" required>
        I declare that the information provided is correct.
        <br><br>

        <button>Submit</button>

    </form>

</body>
</html>
